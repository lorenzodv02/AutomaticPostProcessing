name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # I test coprono parser, ponte di configurazione e soglie: servono solo
      # numpy e PyYAML, quindi la CI resta veloce e non scarica matplotlib/opencv.
      - name: Installa dipendenze di test
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24,<3" "PyYAML>=6,<7" "pytest>=8,<10"

      - name: Test
        run: pytest -q

      - name: Compilazione statica di tutti i moduli
        run: python -m compileall -q main.py config_bridge.py meta_driver analyzer reporting tests
